<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Navy background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="#0b1120"/>

  <!-- Subtle inner glow border -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#1a2744" stroke-width="6"/>

  <!-- Chart area fill (lime gradient) -->
  <path d="M 72 390 L 152 290 L 244 310 L 344 185 L 440 110 L 440 430 L 72 430 Z"
        fill="#84cc16" opacity="0.12"/>

  <!-- Chart line -->
  <polyline
    points="72,390 152,290 244,310 344,185 440,110"
    stroke="#84cc16"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Glowing end dot -->
  <circle cx="440" cy="110" r="32" fill="#84cc16" opacity="0.3"/>
  <circle cx="440" cy="110" r="22" fill="#84cc16"/>
</svg>
